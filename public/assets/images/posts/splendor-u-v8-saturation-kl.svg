<svg xmlns="http://www.w3.org/2000/svg" width="800" height="440" viewBox="0 0 800 440" role="img" aria-labelledby="title desc">
<title id="title">世代ごとのポリシーKLダイバージェンス推移（In-sample vs Held-out）</title>
<desc id="desc">各世代における訓練データ（In-sample）と未知の検証データ（Held-out）に対するPolicy KLダイバージェンスの推移。両者のギャップは全48世代にわたり0.02〜0.04 natsで一定であり、第47世代でのリグレッション時にも過学習（汎化ギャップ拡大）は生じていない。</desc>
<rect width="800" height="440" fill="white"/>
<text x="400" y="34" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold" fill="#222">世代別 Policy KL ダイバージェンスの推移</text>

<!-- Legend -->
<g font-family="sans-serif" font-size="12">
  <line x1="240" y1="58" x2="270" y2="58" stroke="#dc2626" stroke-width="2.5"/>
  <circle cx="255" cy="58" r="4" fill="#dc2626"/>
  <text x="278" y="62" fill="#334155">Held-out（未知局面）</text>

  <line x1="430" y1="58" x2="460" y2="58" stroke="#2563eb" stroke-width="2.5"/>
  <circle cx="445" cy="58" r="4" fill="#2563eb"/>
  <text x="468" y="62" fill="#334155">In-sample（訓練局面）</text>
</g>

<!-- Grid lines & Y axis -->
<g stroke="#e2e8f0" stroke-width="1">
  <line x1="70" y1="98.0" x2="750" y2="98.0"/>
  <line x1="70" y1="140.0" x2="750" y2="140.0"/>
  <line x1="70" y1="182.0" x2="750" y2="182.0"/>
  <line x1="70" y1="224.0" x2="750" y2="224.0"/>
  <line x1="70" y1="266.0" x2="750" y2="266.0"/>
  <line x1="70" y1="308.0" x2="750" y2="308.0"/>
  <line x1="70" y1="350.0" x2="750" y2="350.0"/>
</g>

<!-- Y axis text -->
<g font-family="sans-serif" font-size="12" fill="#64748b" text-anchor="end">
  <text x="60" y="102.0">0.33</text>
  <text x="60" y="144.0">0.30</text>
  <text x="60" y="186.0">0.27</text>
  <text x="60" y="228.0">0.24</text>
  <text x="60" y="270.0">0.21</text>
  <text x="60" y="312.0">0.18</text>
  <text x="60" y="354.0">0.15</text>
</g>
<text x="24" y="224" transform="rotate(-90 24 224)" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#64748b">Policy KL (nats)</text>

<!-- In-sample shaded / gap annotation -->
<rect x="580" y="210" width="165" height="42" rx="4" fill="#f8fafc" stroke="#cbd5e1"/>
<text x="662" y="227" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#334155">汎化ギャップは一定</text>
<text x="662" y="243" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#64748b">0.02〜0.04 nats（過学習なし）</text>

<!-- Held-out Polyline -->
<polyline fill="none" stroke="#dc2626" stroke-width="2.5" points="80.0,168.0 130.8,148.4 181.5,161.0 232.3,169.4 283.1,190.4 333.8,204.4 384.6,210.0 435.4,200.2 486.2,222.6 536.9,190.4 587.7,193.2 638.5,210.0 689.2,204.4 740.0,196.0"/>

<!-- In-sample Polyline -->
<polyline fill="none" stroke="#2563eb" stroke-width="2.5" points="80.0,271.6 130.8,201.6 181.5,198.8 232.3,205.8 283.1,212.8 333.8,243.6 384.6,238.0 435.4,238.0 486.2,253.4 536.9,233.8 587.7,249.2 638.5,245.0 689.2,246.4 740.0,246.4"/>

<!-- Held-out Circles -->
<g fill="#dc2626">
  <circle cx="80.0" cy="168.0" r="3.5"/><circle cx="130.8" cy="148.4" r="3.5"/><circle cx="181.5" cy="161.0" r="3.5"/><circle cx="232.3" cy="169.4" r="3.5"/><circle cx="283.1" cy="190.4" r="3.5"/><circle cx="333.8" cy="204.4" r="3.5"/><circle cx="384.6" cy="210.0" r="3.5"/><circle cx="435.4" cy="200.2" r="3.5"/><circle cx="486.2" cy="222.6" r="3.5"/><circle cx="536.9" cy="190.4" r="3.5"/><circle cx="587.7" cy="193.2" r="3.5"/><circle cx="638.5" cy="210.0" r="3.5"/><circle cx="689.2" cy="204.4" r="3.5"/><circle cx="740.0" cy="196.0" r="3.5"/>
</g>

<!-- In-sample Circles -->
<g fill="#2563eb">
  <circle cx="80.0" cy="271.6" r="3.5"/><circle cx="130.8" cy="201.6" r="3.5"/><circle cx="181.5" cy="198.8" r="3.5"/><circle cx="232.3" cy="205.8" r="3.5"/><circle cx="283.1" cy="212.8" r="3.5"/><circle cx="333.8" cy="243.6" r="3.5"/><circle cx="384.6" cy="238.0" r="3.5"/><circle cx="435.4" cy="238.0" r="3.5"/><circle cx="486.2" cy="253.4" r="3.5"/><circle cx="536.9" cy="233.8" r="3.5"/><circle cx="587.7" cy="249.2" r="3.5"/><circle cx="638.5" cy="245.0" r="3.5"/><circle cx="689.2" cy="246.4" r="3.5"/><circle cx="740.0" cy="246.4" r="3.5"/>
</g>

<!-- X axis labels -->
<g font-family="sans-serif" font-size="11" fill="#475569" text-anchor="middle">
  <text x="80.0" y="375">g0</text>
  <text x="130.8" y="375">g1</text>
  <text x="181.5" y="375">g3</text>
  <text x="232.3" y="375">g7</text>
  <text x="283.1" y="375">g11</text>
  <text x="333.8" y="375">g15</text>
  <text x="384.6" y="375">g19</text>
  <text x="435.4" y="375">g23</text>
  <text x="486.2" y="375">g27</text>
  <text x="536.9" y="375">g31</text>
  <text x="587.7" y="375">g35</text>
  <text x="638.5" y="375">g39</text>
  <text x="689.2" y="375">g43</text>
  <text x="740.0" y="375">g47</text>
</g>
<text x="400" y="400" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#475569">Generation（世代）</text>

<text x="400" y="425" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#64748b">Held-outは同インカムレントの未知64グループ。第47世代でも乖離は広がっておらず、過学習は棄却された。</text>
</svg>