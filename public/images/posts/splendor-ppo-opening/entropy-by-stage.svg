<svg xmlns="http://www.w3.org/2000/svg" width="660" height="660" viewBox="0 0 660 660" role="img" aria-labelledby="chart-title chart-desc">
<title id="chart-title">PPO方策エントロピーは序盤で急減した</title>
<desc id="chart-desc">同一の保留評価局面上で、正規化エントロピー H / ln K を威信点による序盤・中盤・終盤に分け、u0とu1の2学習系統についてE2@232、P@256、P@1024を比較した図。序盤でE2からP256への低下幅が大きい。終盤はより高い値を保つ。</desc>
