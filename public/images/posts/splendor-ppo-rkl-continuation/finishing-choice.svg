<svg xmlns="http://www.w3.org/2000/svg" width="880" height="442" viewBox="0 0 880 442" role="img" aria-labelledby="title desc">
<title id="title">継続学習中の15点到達手のgreedy選択率</title>
<desc id="desc">固定した633の局面で、合法な15点到達手をgreedyに選んだ比率。RKL0の反復256、320、384、448、512、576でそれぞれ623、623、625、611、601、583局面。98.4%から92.1%へ6.3ポイント低下。</desc>
<rect width="880" height="442" rx="18" fill="#ffffff" stroke="#dae4ec" stroke-width="2"/>
<text x="36" y="47" font-size="23" font-weight="700" fill="#172a3b" font-family="Noto Sans CJK JP, Noto Sans JP, Hiragino Sans, sans-serif">15点到達手を選ぶ頻度の推移</text>
<text x="36" y="74" font-size="15" fill="#557086" font-family="Noto Sans CJK JP, Noto Sans JP, Hiragino Sans, sans-serif">RKL0の同一固定bank / 633局面 / 探索なしgreedy</text>
<rect x="656" y="28" width="183" height="55" rx="12" fill="#e7f7f3"/>
<text x="748" y="51" font-size="21" font-weight="700" text-anchor="middle" fill="#007d74" font-family="Noto Sans CJK JP, Noto Sans JP, Hiragino Sans, sans-serif">−6.3 pt</text>
<text x="748" y="70" font-size="12" text-anchor="middle" fill="#527d79" font-family="Noto Sans CJK JP, Noto Sans JP, Hiragino Sans, sans-serif">@256 → @576</text>
<g font-family="Noto Sans CJK JP, Noto Sans JP, Hiragino Sans, sans-serif">
<line x1="128" y1="336.0" x2="770" y2="336.0" stroke="#e6edf2" stroke-width="1"/><text x="112" y="341.0" text-anchor="end" font-size="15" fill="#5d7081">90%</text><line x1="128" y1="293.0" x2="770" y2="293.0" stroke="#e6edf2" stroke-width="1"/><text x="112" y="298.0" text-anchor="end" font-size="15" fill="#5d7081">92%</text><line x1="128" y1="250.0" x2="770" y2="250.0" stroke="#e6edf2" stroke-width="1"/><text x="112" y="255.0" text-anchor="end" font-size="15" fill="#5d7081">94%</text><line x1="128" y1="207.0" x2="770" y2="207.0" stroke="#e6edf2" stroke-width="1"/><text x="112" y="212.0" text-anchor="end" font-size="15" fill="#5d7081">96%</text><line x1="128" y1="164.0" x2="770" y2="164.0" stroke="#e6edf2" stroke-width="1"/><text x="112" y="169.0" text-anchor="end" font-size="15" fill="#5d7081">98%</text><line x1="128" y1="121.0" x2="770" y2="121.0" stroke="#e6edf2" stroke-width="1"/><text x="112" y="126.0" text-anchor="end" font-size="15" fill="#5d7081">100%</text><text x="142.0" y="366" text-anchor="middle" font-size="15" fill="#44566a">@256</text><text x="264.0" y="366" text-anchor="middle" font-size="15" fill="#44566a">@320</text><text x="386.0" y="366" text-anchor="middle" font-size="15" fill="#44566a">@384</text><text x="508.0" y="366" text-anchor="middle" font-size="15" fill="#44566a">@448</text><text x="630.0" y="366" text-anchor="middle" font-size="15" fill="#44566a">@512</text><text x="752.0" y="366" text-anchor="middle" font-size="15" fill="#44566a">@576</text><polygon points="142.0,336 142.0,155.0 264.0,155.0 386.0,148.2 508.0,195.7 630.0,229.7 752.0,290.8 752.0,336" fill="#d6f3ed" fill-opacity="0.9"/><polyline points="142.0,155.0 264.0,155.0 386.0,148.2 508.0,195.7 630.0,229.7 752.0,290.8" fill="none" stroke="#008b7f" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><circle cx="142.0" cy="155.0" r="6.5" fill="#ffffff" stroke="#008b7f" stroke-width="3"/><circle cx="264.0" cy="155.0" r="6.5" fill="#ffffff" stroke="#008b7f" stroke-width="3"/><circle cx="386.0" cy="148.2" r="6.5" fill="#ffffff" stroke="#008b7f" stroke-width="3"/><circle cx="508.0" cy="195.7" r="6.5" fill="#ffffff" stroke="#008b7f" stroke-width="3"/><circle cx="630.0" cy="229.7" r="6.5" fill="#ffffff" stroke="#008b7f" stroke-width="3"/><circle cx="752.0" cy="290.8" r="6.5" fill="#ffffff" stroke="#008b7f" stroke-width="3"/><text x="147.0" y="137.0" text-anchor="start" font-size="17" font-weight="700" fill="#007d74">98.4%</text><text x="745.0" y="271.8" text-anchor="end" font-size="17" font-weight="700" fill="#007d74">92.1%</text>
<text x="449" y="394" font-size="14" text-anchor="middle" fill="#587185">PPO反復</text>
<line x1="36" y1="406" x2="844" y2="406" stroke="#e7edf2"/>
<text x="36" y="429" font-size="13" fill="#627589">15点到達は勝利を保証せず、代替手の勝敗への影響は未測定。</text>
</g>
</svg>