<svg xmlns="http://www.w3.org/2000/svg" width="680" height="700" viewBox="0 0 680 700" role="img" aria-labelledby="chart-title chart-desc">
<title id="chart-title">手番ごとのentropy変化とKL</title>
<desc id="chart-desc">固定評価局面を自手番数で8区分し、P@1024から256反復後の各条件について、エントロピー変化量とKL(P@1024‖actor)を示した図。エントロピー変化は序盤と終盤で大きいU字型、KLは序盤で最小、手番15〜24で最大の山型になる。</desc>
