name: Verify AI style dictionary

on:
  push:
    branches: [chore/setup-textlint-ai-words]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Verify advisory patterns
        run: |
          cat >/tmp/textlint-positive.md <<'EOF'
          これは期待した結果ではない。
          これは期待した結果ではありません。
          この差だけでは改善の結果とは言えない。
          この差だけでは改善の結果とは言えません。
          この差を改善の結果だとは判断できない。
          この差を改善の結果だとは判断できません。
          有意な改善とは判断できなかった。
          EOF

          set +e
          output=$(pnpm dlx --package=textlint@15.8.0 --package=textlint-rule-preset-ai-words-ja@1.2.0 textlint /tmp/textlint-positive.md 2>&1)
          status=$?
          set -e
          printf '%s\n' "$output"
          test "$status" -ne 0
          printf '%s\n' "$output" | grep -q '結果ではない/ありません'
          printf '%s\n' "$output" | grep -q '結果とは言えない'
          printf '%s\n' "$output" | grep -q '〜とは判断できない'

      - name: Verify non-matches
        run: |
          cat >/tmp/textlint-negative.md <<'EOF'
          これは期待した結果ではある。
          これは改善の結果とは言える。
          この差を改善と判断できる。
          EOF
          pnpm dlx --package=textlint@15.8.0 --package=textlint-rule-preset-ai-words-ja@1.2.0 textlint /tmp/textlint-negative.md
